.w2{grid-column:1/3;min-width:0}

 main{padding:12px;border-radius:16px;margin:8px}

<script>
/* =====================================================================
   数据库准备（仅需在 Supabase → SQL Editor 执行一次）：
   alter table tasks add column if not exists stages jsonb default '[]'::jsonb;
   -- 并确保 tasks 表已开启 Realtime（Database → Replication → supabase_realtime）

   -- 全组共享的设置（设计师/部门/类型/需求人选项 + 提醒时间）：
   create table if not exists settings(key text primary key, value jsonb not null default '{}'::jsonb, updated_at timestamptz default now());
   alter table settings enable row level security;
   drop policy if exists settings_all on settings;
   create policy settings_all on settings for all to anon using (true) with check (true);
   do $$ begin if not exists(select 1 from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='settings') then alter publication supabase_realtime add table settings; end if; end $$;
   notify pgrst, 'reload schema';

   -- 本轮新增：操作流水（新增项目 / 提交审核次数统计，按设计师累计）
   create table if not exists task_events(id bigserial primary key, tid text not null, kind text not null default 'submit', at timestamptz not null default now());
   alter table task_events enable row level security;
   drop policy if exists task_events_all on task_events;
   create policy task_events_all on task_events for all to anon using (true) with check (true);
   grant select, insert, update, delete on public.task_events to anon, authenticated;
   grant usage, select on sequence public.task_events_id_seq to anon, authenticated;
   do $$ begin if not exists(select 1 from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='task_events') then alter publication supabase_realtime add table task_events; end if; end $$;
   notify pgrst, 'reload schema';
   ===================================================================== */
const SUPABASE_URL = "https://kynlglwctlicnnydumke.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5bmxnbHdjdGxpY25ueWR1bWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NzkzMDYsImV4cCI6MjEwNzQ1NTMwNn0.FpKcqdsrMwb1sRK4nmk8Tf8b0qY7J_pLMgEPnO2v40I"

/* =========== 密码：加盐 + 多轮 SHA-256，代码中不再出现明文 ===========
   修改密码：登录页打开浏览器控制台，执行 pwHash('新密码')，把结果粘贴到 PW_HASH 即可。 */
const PW_SALT = "ledman-board-v1", PW_ITER = 10000
const PW_HASH = "a06b3280b31ab19a5209aab7338f378a259642a52dbdaf2a6ce31ea912566860"
//SHA-BEGIN
function sha256(str){
  const K=[],H=[];let n=2,c=0;
  const fr=x=>Math.floor((x-Math.floor(x))*4294967296)|0;
  while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}
    if(p){if(c<8)H.push(fr(Math.sqrt(n)));K.push(fr(Math.cbrt(n)));c++}n++}
  const m=new TextEncoder().encode(str),l=m.length,tl=((l+9+63)>>6)<<6,b=new Uint8Array(tl);
  b.set(m);b[l]=0x80;const dv=new DataView(b.buffer);
  dv.setUint32(tl-8,Math.floor(l*8/4294967296));dv.setUint32(tl-4,(l*8)>>>0);
  const h=H.slice(),w=new Int32Array(64),R=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<tl;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],d=w[i-2];
      w[i]=(w[i-16]+(R(a,7)^R(a,18)^(a>>>3))+w[i-7]+(R(d,17)^R(d,19)^(d>>>10)))|0}
    let [a,bb,cc,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const t1=(hh+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0;
      const t2=((R(a,2)^R(a,13)^R(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
    h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+cc)|0;h[3]=(h[3]+d)|0;
    h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')
}
function pwHash(p){let h=sha256(PW_SALT+'|'+p);for(let i=0;i<PW_ITER;i++)h=sha256(h+PW_SALT+p);return h}
//SHA-END

const { createClient } = window.supabase
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

/* ---------- 本机设置存储（提醒设置、下拉选项增删、已提醒记录） ---------- */
const LS={get(k,d){try{const v=localStorage.getItem('ledboard_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ledboard_'+k,JSON.stringify(v))}catch(e){}}};
const E4=()=>({ty:[],d:[],r:[],de:[]});
let CFG=LS.get('cfg',null)||{add:E4(),del:E4()};

/* ---------- 界面环境色彩（本机偏好，不参与全组同步） ---------- */
const THEMES=[['light','光天化日'],['jungle','丛林探险'],['dark','黑灯瞎火']];
const applyTheme=n=>{if(n==='party')n='jungle';if(n)document.documentElement.dataset.theme=n;else delete document.documentElement.dataset.theme;LS.set('theme',n)};
applyTheme(LS.get('theme','light'));

let B=[];
let S={user:'internal',leader:true,lead:LS.get('lead',[72,48,24,12]),fired:LS.get('fired',{})};
let P={m:'day',off:0,who:'',q:'',st:'',so:'desc',pg:0},_pgN=1;
const ST_ALL=['审核中','进行中','待启动','已完成','已暂停'];
const SC={'已完成':'#22a06b','进行中':'#2f6bff','待启动':'#8a94a8','审核中':'#e0912a','已暂停':'#d6523f'},
TY=['其他平面设计','效果图-平面','效果图-3D建模渲染','效果图-视频','动画-3D建模渲染','剪辑合成','视频剪辑','视频拍摄','照片拍摄','输出提供','UI交互','品牌推广工具包'];
const LD=[[72,'3天'],[48,'2天'],[24,'1天'],[12,'半天']];
const iso=d=>d.toLocaleDateString('sv'),TD=()=>iso(new Date()),addD=(s,n)=>iso(new Date(+new Date(s+'T00:00')+n*864e5));
const days=(a,b)=>a&&b?Math.round((new Date(b)-new Date(a))/864e5):null;
const md=s=>s?String(s).slice(5):'?';
let DEF={ty:TY,d:[],r:[],de:[]};
const sp=a=>[...new Set(a.flatMap(x=>(x||'').split(',').map(t=>t.trim())).filter(Boolean))];
/* 设计师「多人」占位选项：设计师已支持下拉多选，禁止该值出现在任何选项列表/筛选条件/设置入口中 */
const isMultiOpt=v=>/多人/.test(String(v||''));
let realtimeChannel=null,STAGES_OK=true,SETTINGS_OK=true,SYNC='ok',DRAG=false,PENDING=false;
let EV=[],EVENTS_OK=true,EV_ERR='';                 /* 操作流水：新增项目 / 提交审核次数统计 */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 进度滑条防误触：只有按住滑块(原点)拖动才改值，点击轨道空白处不改值 ---------- */
const hitThumb=(el,ev)=>{const r=el.getBoundingClientRect(),min=+el.min||0,max=+el.max||100,v=+el.value,fc=max>min?(v-min)/(max-min):0;
 return Math.abs(ev.clientX-(r.left+8+fc*(r.width-16)))<=14};   /* 滑块宽约16px，容差±14px */
function guardSlider(el,onval,oncommit){
 if(!el)return;
 el.onclick=ev=>ev.stopPropagation();
 el.onpointerdown=ev=>{if(hitThumb(el,ev)){delete el.dataset.lk;DRAG=true}else{el.dataset.lk='1';el.dataset.ov=el.value;DRAG=false}};
 el.onpointerup=el.onpointercancel=()=>{DRAG=false;delete el.dataset.lk};
 el.onblur=()=>{delete el.dataset.lk};
 el.oninput=()=>{if(el.dataset.lk){el.value=el.dataset.ov;return}onval&&onval(+el.value)};
 el.onchange=()=>{DRAG=false;const lk=el.dataset.lk;delete el.dataset.lk;if(!lk)oncommit&&oncommit(+el.value)};
}

/* ---------- 状态 / 进度联动：0%=待启动，1~99%=进行中，100%=已完成 ---------- */
const stByP=pct=>pct>=100?'已完成':pct>0?'进行中':'待启动';
const open_=t=>['待启动','进行中','审核中'].includes(t.s);
const warn_=t=>['进行中','审核中'].includes(t.s);   /* 预警仅覆盖进行中/审核中，待启动不进预警 */
const si=s=>{const i=ST_ALL.indexOf(s);return i<0?ST_ALL.length:i};   /* 状态分组排序权重 */

/* ---------- 周期：有阶段时 = 各阶段天数之和；否则 = 开始→完成 ---------- */
const stagesOf=t=>Array.isArray(t.stages)?t.stages:[];
const cyc=t=>{const st=stagesOf(t).filter(x=>x.a&&x.b);return st.length?st.reduce((s,x)=>s+Math.max(0,days(x.a,x.b)),0):days(t.a,t.b)};
const stLabel=(s,i)=>s.l||('阶段'+(i+1));

/* ---------- 数据读写 ---------- */
function norm(r){
  let st=r.stages;if(typeof st==='string'){try{st=JSON.parse(st)}catch(e){st=[]}}
  let rm=r.rm;if(typeof rm==='string'){try{rm=JSON.parse(rm)}catch(e){rm=[]}}
  return{...r,s:r.s==='待开展'?'待启动':(r.s||'待启动'),p:+r.p||0,a:(r.a||'').slice(0,10),b:(r.b||'').slice(0,10),
    stages:Array.isArray(st)?st:[],rm:Array.isArray(rm)?rm:[],de:r.de||'',r:r.r||'',d:r.d||'',t:r.t||''}
}
const inR=(s,a,b)=>!!s&&s>=a&&s<=b;
function rebuildLists(){
  const base={ty:TY,d:sp(B.map(x=>x.d)),r:sp(B.map(x=>x.r)),de:sp(B.map(x=>x.de))};   /* 设计师为多选值，按逗号拆分后逐人计入统计 */
  DEF={};Object.keys(base).forEach(k=>{DEF[k]=[...new Set([...base[k],...(CFG.add[k]||[])])].filter(v=>!(CFG.del[k]||[]).includes(v));
   if(k==='de')DEF[k]=DEF[k].filter(v=>!isMultiOpt(v));   /* 唯一收口：任务数据/本机配置/云端设置任何来源都无法让「多人」选项出现 */
   if(k!=='ty')DEF[k].sort()});
}
/* ---------- 全组共享设置：settings 表，key='board' ---------- */
const cfgVal=v=>{if(typeof v==='string'){try{v=JSON.parse(v)}catch(e){return null}}return v&&typeof v==='object'?v:null};
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v);
function applyCfg(v){
  CFG={add:{...E4(),...(v.add||{})},del:{...E4(),...(v.del||{})}};
  if(Array.isArray(v.lead))S.lead=v.lead.map(Number).filter(x=>x>0).sort((a,b)=>b-a);
  LS.set('cfg',CFG);LS.set('lead',S.lead);rebuildLists();
}
async function loadSettings(){
  const {data,error}=await sb.from('settings').select('value').eq('key','board').maybeSingle();
  if(error){SETTINGS_OK=false;console.warn('settings 读取失败',error);toast('读取设置失败：'+error.message);return false}
  SETTINGS_OK=true;
  const cv=data&&cfgVal(data.value);
  if(cv){applyCfg(cv);return true}
  // 云端还没有设置：把本机已有的设置作为初始值上传一次
  const lc=LS.get('cfg',null),ll=LS.get('lead',null);
  if(lc||ll){const v={add:(lc||CFG).add,del:(lc||CFG).del,lead:ll||S.lead};await sb.from('settings').upsert({key:'board',value:v,updated_at:new Date().toISOString()});applyCfg(v)}
  return true;
}
async function mutateCfg(fn){ // 先取云端最新值再改，避免覆盖他人刚做的修改
  setSync('saving');
  let cur={add:CFG.add,del:CFG.del,lead:S.lead};
  if(SETTINGS_OK){
    const {data,error}=await sb.from('settings').select('value').eq('key','board').maybeSingle();
    const cv=!error&&data&&cfgVal(data.value);
    if(cv)cur={add:{...E4(),...(cv.add||{})},del:{...E4(),...(cv.del||{})},lead:Array.isArray(cv.lead)?cv.lead:S.lead};
  }
  fn(cur);
  if(SETTINGS_OK){
    const {error}=await sb.from('settings').upsert({key:'board',value:cur,updated_at:new Date().toISOString()});
    if(error){toast('设置保存失败：'+error.message);setSync('err');return false}
    // 读回校验：确认云端真的存进去了、且能读出同样的内容
    const rb=await sb.from('settings').select('value').eq('key','board').maybeSingle(),bv=rb.data&&cfgVal(rb.data.value);
    if(rb.error||!bv||sj(bv)!==sj(cur)){setSync('err');toast('⚠ 设置已提交，但读回内容与保存的不一致，请检查 settings 表的 value 列类型是否为 jsonb、key 是否唯一');return false}
  }
  applyCfg(cur);setSync('ok');return true;
}
function setSync(s){SYNC=s;const e=$('#sc');if(e)e.textContent=({ok:'🟢 实时同步',poll:'🟡 定时同步',saving:'⏳ 保存中…',err:'🔴 同步失败'})[s]||''}
async function loadAllTasks(){
  // Supabase 单次最多返回 1000 行，这里分页读取，避免超过 1000 条后静默丢数据
  let rows=[],from=0;const step=1000;
  for(;;){
    const {data,error}=await sb.from('tasks').select('*').order('id').range(from,from+step-1);
    if(error){toast('读取任务失败：'+error.message);setSync('err');return false}
    rows=rows.concat(data||[]);if(!data||data.length<step)break;from+=step;
  }
  B=rows.map(norm);
  STAGES_OK=!rows.length||rows.some(r=>'stages' in r);
  rebuildLists();return true;
}
/* ---------- 操作流水：提交审核次数 ---------- */
async function loadEvents(){
  let rows=[],from=0;const step=1000;
  for(;;){
    const {data,error}=await sb.from('task_events').select('*').order('id').range(from,from+step-1);
    if(error){EVENTS_OK=false;EV=[];EV_ERR=(error&&error.message)||String(error);console.warn('task_events 读取失败',error);return false}
    rows=rows.concat(data||[]);if(!data||data.length<step)break;from+=step;
  }
  EVENTS_OK=true;EV_ERR='';EV=rows.map(e=>({id:e.id,tid:e.tid,kind:e.kind||'submit',d:e.at?iso(new Date(e.at)):''}));
  return true;
}
async function logEvent(tid,kind){
  if(!tid)return false;
  const {data,error}=await sb.from('task_events').insert({tid,kind}).select();
  if(error){console.warn('流水写入失败',error);toast('提交记录写入失败：'+error.message);return false}
  if(data&&data[0])EV.push({id:data[0].id,tid:data[0].tid,kind:data[0].kind||kind,d:String(data[0].at||'').slice(0,10)});
  render();return true;   /* 立即刷新，设计师统筹的「提交审核」列同步 +1 */
}
function rowOf(t){
  const r={id:t.id,t:t.t,ty:t.ty,d:t.d,s:t.s,p:t.p,n:(t.n===''||t.n==null)?null:+t.n,a:t.a||null,b:t.b||null,de:t.de,r:t.r,f:!!t.f,note:t.note,pr:t.pr,path:t.path,rm:t.rm||[]};
  if(STAGES_OK)r.stages=t.stages||[];return r;
}
async function saveTaskToDb(t){
  setSync('saving');
  let {error}=await sb.from('tasks').upsert(rowOf(t));
  if(error&&STAGES_OK&&/stages/i.test(error.message||'')){
    STAGES_OK=false;({error}=await sb.from('tasks').upsert(rowOf(t)));
  }
  if(error){toast('保存失败：'+error.message);setSync('err');return false}
  setSync('ok');return true;
}
async function patchTask(t,fields){ // 乐观更新，失败自动还原
  const sub=fields.s==='审核中'&&t.s!=='审核中';            /* 首次进入「审核中」记一次提交 */
  const old={};Object.keys(fields).forEach(k=>old[k]=t[k]);Object.assign(t,fields);render();setSync('saving');
  const {data,error}=await sb.from('tasks').update(fields).eq('id',t.id).select('id');
  if(error||!data||!data.length){Object.assign(t,old);render();setSync('err');toast(error?'保存失败，已还原：'+error.message:'该任务已被他人删除，请刷新');return false}
  if(sub)await logEvent(t.id,'submit');
  setSync('ok');return true;
}
async function deleteTaskFromDb(id){
  const {error}=await sb.from('tasks').delete().eq('id',id);
  if(error){toast('删除失败：'+error.message);return false}
  B=B.filter(x=>x.id!=id);rebuildLists();return true;
}
function soft(){if(DRAG){PENDING=true;return}render()}
function applyChange(p){
  if(p.eventType==='DELETE'){B=B.filter(x=>x.id!=(p.old||{}).id)}
  else if(p.new){const r=norm(p.new),i=B.findIndex(x=>x.id==r.id);i>=0?B[i]=r:B.push(r)}
  rebuildLists();soft();
}
function subscribeRealtime(){
  if(realtimeChannel)sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel('task_watch')
    .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},applyChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'settings'},p=>{const cv=p.new&&cfgVal(p.new.value);if(cv){applyCfg(cv);soft()}})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'task_events'},p=>{const e=p.new;if(!e||EV.some(x=>x.id===e.id))return;EV.push({id:e.id,tid:e.tid,kind:e.kind||'submit',d:e.at?iso(new Date(e.at)):''});soft()})
    .subscribe(st=>{if(st==='SUBSCRIBED')setSync('ok');else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(st))setSync('poll')});
}
async function resync(){if(document.hidden)return;await loadSettings();await loadEvents();if(await loadAllTasks()){soft();tick()}}

/* ---------- 统计 / 预警 ---------- */
function G(d){d=(d||'未填写').split(',')[0].trim();return/国际/.test(d)?'国际LED事业部':/国内/.test(d)?'国内LED事业部':d;}
const all=()=>B;
function range(){const n=new Date(),o=P.off;let a,b;
 if(P.m=='day'){a=b=addD(TD(),o)}
 else if(P.m=='week'){const d=(n.getDay()+6)%7;a=iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()-d+7*o));b=addD(a,6)}
 else if(P.m=='month'){a=iso(new Date(n.getFullYear(),n.getMonth()+o,1));b=iso(new Date(n.getFullYear(),n.getMonth()+o+1,0))}
 else if(P.m=='quarter'){const q=Math.floor(n.getMonth()/3)*3+o*3;a=iso(new Date(n.getFullYear(),q,1));b=iso(new Date(n.getFullYear(),q+3,0))}
 else if(P.m=='year'){const y=n.getFullYear()+o;a=y+'-01-01';b=y+'-12-31'}else{a='0000';b='9999'}
 return[a,b]}
const lab=()=>{const[a,b]=range();return P.m=='all'?'全部时间':P.m=='day'?a:P.m=='week'?a+' ~ '+b.slice(5):P.m=='month'?a.slice(0,7):P.m=='year'?a.slice(0,4)+'年':a.slice(0,7)+' ~ '+b.slice(0,7)};
const deHasS=(s,d)=>(s||'').split(',').map(x=>x.trim()).includes(d); /* 设计师可多选：de 为逗号分隔多值 */
const deHas=(t,d)=>deHasS(t.de,d);
const mine=()=>all().filter(t=>S.leader?(!P.who||deHas(t,P.who)):deHas(t,S.user));
const visible=()=>all().filter(t=>S.leader||deHas(t,S.user)); // 提醒不受“设计师筛选”影响
function scope(l){const[a,b]=range();return l.filter(t=>{const e=t.b||t.a;if(!e)return false;
 if(P.m=='day')return (t.a||e)<=a&&a<=e;return e>=a&&e<=b})}
function stat(l){const c=l.map(cyc).filter(v=>v!=null),dn=l.filter(t=>t.s=='已完成');
 return{n:l.length,dn:dn.length,rate:l.length?Math.round(dn.length/l.length*100):0,cy:c.length?(c.reduce((s,v)=>s+v,0)/c.length).toFixed(1):'-',fin:l.reduce((s,t)=>s+(+t.n||0),0),fl:l.filter(t=>t.f).length,op:l.filter(open_).length}}
function cnt(l,f){const o={};l.forEach(t=>{const k=f(t);o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
const bars=(e,n)=>e.slice(0,10).map(([k,v])=>`<div class="br"><span title="${esc(k)}">${esc(k)}</span><div><i style="width:${v/n*100}%"></i></div><span>${v} · ${Math.round(v/n*100)}%</span></div>`).join('')||'<div class="k">暂无数据</div>';
/* 当前需要提醒的截止点：有阶段 → 取最近一个“未完成阶段”的结束日；否则取任务计划完成日 */
function dueOf(t){
  const st=stagesOf(t),nx=st.map((s,i)=>({s,i})).filter(x=>x.s.b&&!x.s.d).sort((p,q)=>p.s.b<q.s.b?-1:p.s.b>q.s.b?1:p.i-q.i)[0];
  if(nx)return{end:nx.s.b,label:stLabel(nx.s,nx.i)};
  return t.b?{end:t.b,label:''}:null;
}
function alerts(l){const now=Date.now(),r=[];
 l.filter(warn_).forEach(t=>{const du=dueOf(t);if(!du)return;
  const h=(new Date(du.end+'T18:00')-now)/36e5,ls=(t.rm&&t.rm.length?t.rm:S.lead);
  if(isNaN(h))return;
  if(h<0)r.push({t,h,lv:0,end:du.end,sg:du.label});else{const m=ls.filter(x=>h<=x);if(m.length)r.push({t,h,lv:Math.min(...m),end:du.end,sg:du.label})}});
 return r.sort((a,b)=>a.h-b.h)}
/* 预警按当前时间段过滤：提醒截止点落在所选时间段内，或已逾期（逾期任务任何时间段都显示） */
function alS(l){const a=addD(TD(),P.off),b=addD(a,{d:7}),o=addD(a,{mo:1}),q=addD(a,{mo:3}),y=addD(a,{y:1});
 if(P.m=='all')return l.filter(warn_);
 const hi=P.m=='day'?a:P.m=='week'?b:P.m=='month'?o:P.m=='quarter'?q:y;
 return l.filter(t=>{if(!warn_(t))return false;const du=dueOf(t);if(!du)return false;const E=du.end;return E<a||(E>=a&&E<=hi)})}
const fh=h=>h<0?'已逾期 '+(Math.abs(h)>48?Math.round(Math.abs(h)/24)+'天':Math.round(Math.abs(h))+'小时'):h<1?'不足1小时':h<48?'剩 '+Math.round(h)+' 小时':'剩 '+Math.round(h/24)+' 天';
/* 预警项目栏卡片标识：逾期😱，其余预警用铃铛🔔；统一 22px 尺寸（.emo），右上角绝对定位。任务卡栏不显示 */
const tEmo=(t,h)=>h<0?'😱':'🔔';
const tEmoTip=(t,h)=>h<0?'已逾期':'剩余时间预警';
const emoTag=(t,h)=>`<span class="emo" title="${tEmoTip(t,h)}">${tEmo(t,h)}</span>`;
let toastTimer;
function toast(m){const e=$('#ts');e.textContent=m;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,3200)}

/* ---------- 主渲染 ---------- */
function render(){
 const alOpen=$('#alp')&&!$('#alp').hidden;
 const base=mine(),l=scope(base),s=stat(l),al=alerts(alS(base)),L=S.leader;
 const sl=cnt(l,t=>t.s),gr=cnt(l,t=>G(t.d)),ty=cnt(l,t=>(t.ty||'未分类').split(',')[0]);
 let acc=0;const dn=l.length?'conic-gradient('+sl.map(([k,v])=>{const a=acc/l.length*100;acc+=v;return`${SC[k]||'#999'} ${a}% ${acc/l.length*100}%`}).join(',')+')':'var(--bd)';
 /* 按月任务量：始终保持年度显示（跟随当前查看年份），不随标签切换消失 */

 const q=P.q.toLowerCase();

 const pgN=Math.max(1,Math.ceil(f.length/100)),pg=Math.min(P.pg||0,pgN-1);_pgN=pgN;
 const alCard=a=>`<div class="mt" style="cursor:pointer" data-e="${esc(a.t.id)}"><b class="${a.h<0?'red':'org'}">${fh(a.h)}</b> · ${esc(a.t.t)}${a.sg?` <span class="tg">${esc(a.sg)}</span>`:''}<br>${esc(a.t.de)} · 截止 ${a.end}</div>`;
 const [pa,pb]=range(),deOf={};B.forEach(t=>{deOf[t.id]=t.de});   /* 操作数据：新增项目 / 提交审核 / 进度效率 */
 const newN=d=>EV.filter(e=>e.kind=='create'&&inR(e.d,pa,pb)&&deHasS(deOf[e.tid],d)).length;
 const subN=d=>EV.filter(e=>e.kind=='submit'&&inR(e.d,pa,pb)&&deHasS(deOf[e.tid],d)).length;
 const ovTbl=L?`<div class="cd sc" style="margin-bottom:14px"><h3>设计师统筹（${lab()}）</h3><table><tr><th>设计师</th><th>任务</th><th>完成</th><th>完成率</th><th>平均周期</th><th>定稿</th><th>未完成</th><th>预警</th><th>新增项目</th><th>进度效率</th><th>提交审核</th></tr>${DEF.de.map(d=>{const x=l.filter(t=>deHas(t,d)),y=stat(x),an=alerts(alS(x)).length,
  avgP=x.length?Math.round(x.reduce((s,t)=>s+(+t.p||0),0)/x.length*100):0;
  return`<tr><td><a href="#" data-w="${esc(d)}" style="color:${P.who==d?'#e0912a':'var(--tx)'};text-decoration:none;font-weight:${P.who==d?'700':'400'}">${esc(d)}</a></td><td>${y.n}</td><td>${y.dn}</td><td>${y.rate}%</td><td>${y.cy}天</td><td>${y.fin}</td><td>${y.op}</td><td>${an?`<span class="red">${an}</span>`:0}</td><td>${newN(d)}</td><td>${avgP}%→${y.rate}%</td><td>${subN(d)}</td></tr>`}).join('')}</table><div class="k" style="margin-top:8px">新增项目：按新建任务卡的时间统计（按设计师累计）；进度效率：周期内任务平均进度 → 完成率；提交审核：该周期内提交审核次数。</div></div>`:'';
 $('#appMain').innerHTML=`<header><button id="sg">⚙ 设置</button><b>内容创意组工作看板</b><span class="k">${L?'全部看板':'👤 '+esc(S.user)}</span><span id="sc" class="k"></span><span class="sp"></span>

/* 复制兜底：剪贴板 API（https/localhost）→ 隐藏 textarea+execCommand（file:// 也能用）→ 弹窗手动复制 */
function copyPlain(t,msg){
  const ok=()=>toast(msg||'已复制到剪贴板');
  if(window.isSecureContext&&navigator.clipboard)return navigator.clipboard.writeText(t).then(ok,()=>copyFallback(t,msg));
  return copyFallback(t,msg);
}
function copyFallback(t,msg){
  const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:-9999px;left:0;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}a.remove();
  if(ok)return toast(msg||'已复制到剪贴板');
  $('#md').innerHTML=`<div class="md" style="z-index:25"><div style="max-width:620px"><button class="x" id="no">✕</button><h3>${msg||'复制内容'}</h3><div class="k" style="margin:0 0 8px">浏览器未能自动复制，下方内容已全选，直接按 Ctrl+C 即可。</div><textarea id="rpt" style="width:100%;height:44vh;font-size:12px;line-height:1.7">${esc(t)}</textarea></div></div>`;
  const ta=$('#rpt');ta.focus();ta.select();$('#no').onclick=()=>{$('#md').innerHTML=''};
}

function openP(p){if(p.includes('://')){window.open(p,'_blank','noopener');return}copyPlain(p,'📁 路径已复制，粘贴到资源管理器/访达地址栏即可打开')}

function askPwd(desc,ok){$('#md').innerHTML=`<div class="md" style="z-index:25"><div style="max-width:380px"><button class="x" id="pq">✕</button><h3 style="font-size:15px">请输入访问密码确认</h3><div class="k" style="margin:0 0 10px">${desc}</div><input id="pwi" type="password" placeholder="输入访问密码" autocomplete="off" style="width:100%;margin-bottom:6px"><div id="pwe" style="display:none;color:#d6523f;font-size:12px;margin-bottom:10px"></div><div class="row" style="justify-content:flex-end;margin:0"><button id="pwc" style="min-width:90px">取消</button><button class="pr" id="pwo" style="min-width:110px">确认生效</button></div></div></div>`;
 const inp=$('#pwi'),err=$('#pwe');inp.focus();
 const fail=m=>{err.textContent=m;err.style.display='block';inp.value='';inp.focus()};
 const go=async()=>{const p=inp.value.trim();if(!p)return fail('请输入密码');
  await new Promise(r=>setTimeout(r,20));
  if(pwHash(p)!==PW_HASH)return fail('密码错误，操作未生效');
  $('#md').innerHTML='';await ok()};
 $('#pwo').onclick=go;inp.onkeydown=e=>{if(e.key=='Enter')go()};

async function put(t){
  const i=B.findIndex(x=>x.id==t.id),prev=i>=0?B[i]:null;
  if(!await saveTaskToDb(t))return false;           // 失败时保留弹窗，数据不丢
  if(t.s==='审核中'&&(!prev||prev.s!=='审核中'))logEvent(t.id,'submit');
  if(i<0)logEvent(t.id,'create');   /* 新建任务卡：记一条「新增项目」流水，按设计师累计 */
  i>=0?B[i]=t:B.push(t);
  rebuildLists();$('#md').innerHTML='';render();toast('已保存');return true;
}

 <div class="w2 trow"><label>开始时间<input type="date" id="f_a" value="${x.a||''}"></label><label>计划完成时间<input type="date" id="f_b" value="${x.b||''}"></label><button type="button" class="sm" id="addSt" title="添加阶段时间（审核/穿插/暂停后分段完成）">＋ 添加阶段</button></div>
 <div class="w2"><div id="stl"></div><div class="k" id="stn" hidden>已启用阶段时间：开始/完成时间由阶段自动计算，周期 = 各阶段天数之和；每个未完成阶段的结束日都会单独触发提醒。</div></div>
 <div class="w2">周期：<b id="cy"></b> ${[[1,'1天'],[2,'2天'],[3,'3天'],[7,'1周'],[14,'2周']].map(([d,k])=>`<button type="button" class="sm" data-c="${d}">${k}</button>`).join(' ')}</div>
 <label>进展状态<select id="f_s">${o(ST_ALL,x.s)}</select></label><label>优先级<select id="f_pr"><option></option>${o(['高','中','低'],x.pr)}</select></label>
 <label>进度 <span id="pv_">${Math.round((x.p||0)*100)}%</span><input type="range" class="sl" id="f_p" min="0" max="100" step="5" value="${Math.round((x.p||0)*100)}"></label>
 <label>定稿数量<input type="number" id="f_n" min="1" step="1" inputmode="numeric" value="${x.n??''}"></label>
 <label class="w2"><input type="checkbox" id="f_f" ${x.f?'checked':''}> 是否有流程</label>
 <label class="w2">项目路径位置<input id="f_path" value="${esc(x.path||'')}" placeholder="粘贴网盘链接或文件夹路径"></label>
 <label class="w2">工作描述及备注<textarea id="f_note" rows="2">${esc(x.note||'')}</textarea></label>
 <div class="w2"><span class="k">本任务预警提醒（不选则用默认）</span><br>${LD.map(([h,k])=>`<label style="display:inline-block;margin-right:10px"><input type="checkbox" class="rmc" value="${h}" ${rm.includes(h)?'checked':''}> 截止前${k}</label>`).join('')}</div></div>
 <div class="ft"><span></span><button class="pr" id="ok">保存</button>${n?'<span></span>':'<button id="rmv" title="删除" aria-label="删除">🗑</button>'}</div></div></div>`;
 /* 实时校验：在表单渲染完成后绑定（change 事件冒泡到 div#f_ty 亦可触发多选校验） */
 ORDER.forEach(id=>{const el=$('#'+id);if(!el)return;el.addEventListener('input',()=>chk(id));el.addEventListener('change',()=>chk(id))});
 /* 设计类型、设计师：下拉框多选 */
 const wireMs=(id,cls)=>{const w=$('#'+id);if(!w)return;const b=w.querySelector('.msb'),p=w.querySelector('.msp');
  const up=()=>{const s=[...p.querySelectorAll('.'+cls+':checked')].map(c=>c.value);b.textContent=s.length?s.join('、'):'请选择（可多选）';b.classList.toggle('ph',!s.length)};
  b.onclick=e=>{e.preventDefault();p.hidden=!p.hidden};p.onchange=up;up()};
 wireMs('f_ty','tyc');wireMs('f_de','dec');
 /* 事业部/部门、需求人：自绘输入下拉（替代 datalist —— iOS Safari 不支持 datalist，安卓在弹窗内也常不弹出） */
 document.querySelectorAll('#md .cmb').forEach(w=>{const inp=w.querySelector('input'),lst=w.querySelector('.clst');
  const flt=()=>{const q=inp.value.trim().toLowerCase();lst.querySelectorAll('.cit').forEach(c=>c.style.display=!q||c.dataset.v.toLowerCase().includes(q)?'':'none')};
  inp.addEventListener('focus',()=>{lst.hidden=false;flt()});inp.addEventListener('click',()=>{lst.hidden=false;flt()});inp.addEventListener('input',flt);
  lst.addEventListener('pointerdown',e=>{e.preventDefault();const c=e.target.closest('.cit');if(!c)return;inp.value=c.dataset.v;lst.hidden=true;inp.dispatchEvent(new Event('input',{bubbles:true}))});
  inp.addEventListener('blur',()=>{lst.hidden=true})});

 /* 阶段时间编辑 */
 const stRows=()=>{$('#stl').innerHTML=ST.map((s,i)=>`<div class="sr" data-i="${i}"><input class="l sl_l" placeholder="阶段名称，如：初稿 / 修改 / 终稿" value="${esc(s.l||'')}"><input type="date" class="sl_a" value="${s.a||''}" title="阶段开始"><input type="date" class="sl_b" value="${s.b||''}" title="阶段结束"><div class="sm2"><label><input type="checkbox" class="sl_d" ${s.d?'checked':''}> 该阶段已完成</label><span class="k sdu">${s.a&&s.b?days(s.a,s.b)+' 天':'-'}</span><select class="sl_c" title="选择周期：以阶段开始日为起点自动推算结束日"><option value="">周期</option>${[[1,'1天'],[2,'2天'],[3,'3天'],[7,'1周'],[14,'2周']].map(([d,k])=>`<option value="${d}">${k}</option>`).join('')}</select><button type="button" class="sm sdel">✕ 删除</button></div></div>`).join('')};
 const sync=()=>{const has=ST.length>0;
  if(has){const as=ST.map(s=>s.a).filter(Boolean).sort(),bs=ST.map(s=>s.b).filter(Boolean).sort();$('#f_a').value=as[0]||'';$('#f_b').value=bs[bs.length-1]||''}
  $('#f_a').disabled=$('#f_b').disabled=has;document.querySelectorAll('[data-c]').forEach(b=>b.disabled=has);$('#stn').hidden=!has;
  const tot=ST.filter(s=>s.a&&s.b).reduce((z,s)=>z+Math.max(0,days(s.a,s.b)),0);
  $('#cy').textContent=has?`${tot} 天（${ST.length} 个阶段合计）`:((days($('#f_a').value,$('#f_b').value)??'-')+' 天')};
 stRows();sync();
 $('#f_a').onchange=$('#f_b').onchange=sync;
 $('#addSt').onclick=()=>{
  if(!ST.length){
   ST.push({l:'阶段1',a:$('#f_a').value||TD(),b:$('#f_b').value||addD(TD(),1),d:true});
   ST.push({l:'阶段2',a:TD(),b:addD(TD(),1),d:false});
  }else{ST.push({l:'阶段'+(ST.length+1),a:TD(),b:addD(TD(),1),d:false})}
  stRows();sync();chk('f_a')};
 $('#stl').oninput=$('#stl').onchange=e=>{const r=e.target.closest('.sr');if(!r)return;const s=ST[+r.dataset.i],c=e.target.classList;
  if(c.contains('sl_l'))s.l=e.target.value;else if(c.contains('sl_a'))s.a=e.target.value;else if(c.contains('sl_b'))s.b=e.target.value;else if(c.contains('sl_d'))s.d=e.target.checked;
  else if(c.contains('sl_c')&&e.target.value){s.a=s.a||TD();s.b=addD(s.a,+e.target.value);r.querySelector('.sl_a').value=s.a;r.querySelector('.sl_b').value=s.b}
  r.querySelector('.sdu').textContent=s.a&&s.b?days(s.a,s.b)+' 天':'-';sync();chk('f_a')};
 $('#stl').onclick=e=>{const b=e.target.closest('.sdel');if(b){ST.splice(+b.closest('.sr').dataset.i,1);stRows();sync();chk('f_a')}};

 /* 进度 ↔ 状态 联动 */
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{$('#f_b').value=addD($('#f_a').value||TD(),+b.dataset.c);sync()});
 $('#f_n').oninput=()=>{const e=$('#f_n');e.value=e.value.replace(/[^0-9]/g,'')};
 guardSlider($('#f_p'),v=>{$('#pv_').textContent=v+'%';$('#f_s').value=stByP(v)});
 $('#f_s').onchange=e=>{const s=e.target.value;if(s=='已完成'){$('#f_p').value=100;$('#pv_').textContent='100%'}else if(s=='待启动'){$('#f_p').value=0;$('#pv_').textContent='0%'}};
 $('#no').onclick=()=>$('#md').innerHTML='';
 const r=$('#rmv');if(r)r.onclick=()=>ask('确定删除该任务？',async()=>{if(await deleteTaskFromDb(x.id)){render();toast('已删除')}},'删除');
 $('#ok').onclick=async()=>{const v=i=>$('#f_'+i).value.trim();
  const bad=chkAll();                                   /* 提交时二次校验：必填 + 定稿数量 > 0 */
  if(bad.length){const el=$('#'+bad[0]);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});if(el.focus)el.focus()}
   return toast('请完善标红字段：'+bad.map(id=>LAB[id]).join('、'))}
  const sts=ST.map(s=>({l:(s.l||'').trim(),a:s.a||'',b:s.b||'',d:!!s.d}));
  const RE=/^\d{4}-\d{2}-\d{2}$/;
  for(const s of sts){if(!s.a||!s.b)return toast('请补全每个阶段的开始和结束日期');if(!RE.test(s.a)||!RE.test(s.b))return toast('阶段日期格式不正确，请重新选择');if(s.b<s.a)return toast('阶段结束时间不能早于阶段开始时间')}
  sts.sort((p,q)=>p.a<q.a?-1:p.a>q.a?1:p.b<q.b?-1:p.b>q.b?1:0);sts.forEach((s,i)=>{if(!s.l)s.l='阶段'+(i+1)});
  let a=v('a'),b=v('b');if(sts.length){a=sts[0].a;b=sts.map(s=>s.b).sort().pop()}
  if((a&&!RE.test(a))||(b&&!RE.test(b)))return toast('时间格式不正确，请重新选择');
  if(a&&b&&b<a)return toast('完成时间不能早于开始时间');
  let s=v('s'),p=Math.round(+$('#f_p').value)/100;if(s=='已完成')p=1;if(s=='待启动')p=0;
  const nn=v('n')===''?null:Math.max(0,Math.floor(+v('n')||0));
  const rmv=[...document.querySelectorAll('.rmc:checked')].map(c=>+c.value);
  $('#ok').disabled=true;
  const okk=await put({...x,t:v('t'),ty:[...document.querySelectorAll('#f_ty .tyc:checked')].map(c=>c.value).join(','),d:v('d'),r:v('r'),de:S.leader?[...document.querySelectorAll('#f_de .dec:checked')].map(c=>c.value).join(','):v('de'),a,b,s,p,pr:v('pr'),n:nn,f:$('#f_f').checked,note:v('note'),path:v('path'),rm:[...new Set(rmv)],stages:sts});
  if(!okk&&$('#ok'))$('#ok').disabled=false}}

function setf(tab){const N={ty:'设计类型',d:'事业部/部门',r:'需求人',de:'设计师'};
 const TABS=[['tp','任务卡模板'],['al','预警提醒'],['ui','界面设置']];if(!TABS.some(x=>x[0]==tab))tab='tp';
 const body=tab=='tp'?Object.keys(N).map(k=>`<div style="margin-bottom:12px"><div class="setrow"><b>${N[k]}</b><span class="k">${DEF[k].length} 项</span><input id="ni_${k}" data-k="${k}" placeholder="新增${N[k]}，回车或点＋添加" style="flex:1"><button class="ad" data-k="${k}">＋ 添加</button></div><div class="opt">${DEF[k].map((v,i)=>`<span class="tg" style="padding:3px 6px 3px 9px">${esc(v)} <a href="#" class="dx" data-k="${k}" data-i="${i}" style="color:#d6523f;text-decoration:none">✕</a></span>`).join('')||'<span class="k">暂无选项</span>'}</div></div>`).join('')+'<div class="k">添加或删除选项均需输入访问密码确认，防止误触；增删只影响新建/编辑任务卡时的下拉选项，已有任务不受影响；选项设置全组共享，所有人同步生效。</div>'
  :tab=='al'?`<div class="k">截止时间按计划完成日（或各阶段结束日）18:00 计算。进入所选时间窗口后会出现在预警列表，并弹出提醒。提醒时间设置全组共享，修改后所有人生效（单张任务卡上单独勾选的提醒不受影响）。</div><p>${LD.map(([h,k])=>`<label style="display:block;margin:6px 0"><input type="checkbox" class="dc" value="${h}" ${S.lead.includes(h)?'checked':''}> 截止前 ${k}提醒（${h}小时）</label>`).join('')}</p><p><button id="nt">🔔 开启系统通知</button></p><div class="ft"><span></span><button class="pr" id="sv">保存</button><span></span></div>`
  :`<p class="k">环境色彩仅影响本机显示，不参与全组同步。</p><p class="chips">${THEMES.map(([k,n])=>`<span class="chip ${LS.get('theme','light')==k?'on':''}" data-thm="${k}" style="--c:${k=='jungle'?'#1fd67a':k=='dark'?'#3a4152':'#5b8def'}">${n}</span>`).join('')}</p>`;
 $('#md').innerHTML=`<div class="md"><div><button class="x" id="no">✕</button><h3>⚙ 设置</h3><div class="row">${TABS.map(([k,n])=>`<button class="tab ${tab==k?'on':''}" id="tab_${k}">${n}</button>`).join('')}</div>`+body+`</div></div>`;
 $('#no').onclick=()=>{$('#md').innerHTML=''};TABS.forEach(([k])=>{const b=$('#tab_'+k);if(b)b.onclick=()=>setf(k)});
 document.querySelectorAll('[data-thm]').forEach(c=>c.onclick=()=>{applyTheme(c.dataset.thm);setf('ui')});
 const add=k=>{const inp=$('#ni_'+k),v=inp.value.trim();if(!v)return;
  if(k==='de'&&isMultiOpt(v)){inp.value='';return toast('设计师已支持下拉多选，不支持新增「多人」选项；请直接勾选多位设计师')}   /* 设置面板不提供任何「多人」入口 */
  /* 添加需密码确认，防止误触 */
  askPwd(`确认添加${N[k]}选项：<b>${esc(v)}</b>`,async()=>{const r=await mutateCfg(c=>{c.add[k]=[...new Set([...(c.add[k]||[]),v])];c.del[k]=(c.del[k]||[]).filter(z=>z!==v)});setf('tp');if(r)toast('已添加：'+v)})};
 document.querySelectorAll('.ad').forEach(b=>b.onclick=()=>add(b.dataset.k));document.querySelectorAll('[id^=ni_]').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')add(i.dataset.k)});
 document.querySelectorAll('.dx').forEach(a=>a.onclick=e=>{e.preventDefault();const k=a.dataset.k,v=DEF[k][+a.dataset.i];   /* 删除需密码确认，密码不对不生效 */
  askPwd(`确认删除${N[k]}选项：<b style="color:#d6523f">${esc(v)}</b>？删除后新建/编辑任务卡时将不再出现该选项（已有任务不受影响）。`,async()=>{const r=await mutateCfg(c=>{c.add[k]=(c.add[k]||[]).filter(z=>z!==v);c.del[k]=[...new Set([...(c.del[k]||[]),v])]});setf('tp');if(r)toast('已删除：'+v)})});
 const nt=$('#nt');if(nt)nt.onclick=()=>{try{Notification.requestPermission().then(r=>toast(r=='granted'?'通知已开启':'未授权，仍会在页面内提醒'))}catch(e){toast('当前浏览器不支持系统通知')}};
 const sv=$('#sv');if(sv)sv.onclick=async()=>{const lead=[...new Set([...document.querySelectorAll('.dc:checked')].map(c=>+c.value))].sort((a,b)=>b-a);sv.disabled=true;
  if(await mutateCfg(c=>{c.lead=lead})){$('#md').innerHTML='';render();tick();toast('提醒设置已保存（全组共享）')}else sv.disabled=false}}

/* ---------- 到期提醒：登录后立即检查，之后每分钟 + 切回页面时检查；已提醒记录持久化，刷新不重复轰炸 ---------- */
function tick(){
  if(!B.length)return;
  const today=TD(),fresh=[];
  alerts(visible()).forEach(a=>{const k=a.t.id+'|'+a.end+'|'+a.lv+(a.lv===0?'|'+today:'');if(S.fired[k])return;S.fired[k]=Date.now();fresh.push(a)});
  if(!fresh.length)return;
  const lim=Date.now()-60*864e5;Object.keys(S.fired).forEach(k=>{if(S.fired[k]<lim)delete S.fired[k]});LS.set('fired',S.fired);
  const f0=fresh[0];toast(`⏰ ${f0.t.t}${f0.sg?'['+f0.sg+']':''}：${fh(f0.h)}${fresh.length>1?`　等共 ${fresh.length} 项`:''}`);
  try{if(Notification.permission=='granted')fresh.slice(0,5).forEach(a=>new Notification('任务预警',{body:`${a.t.t}${a.sg?'['+a.sg+']':''}：${fh(a.h)}`}))}catch(e){}
}

document.addEventListener('click',e=>{const a=$('#alp');if(a&&!a.hidden&&!e.target.closest('#alp,#bl,[data-e]'))a.hidden=true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resync()});
window.addEventListener('online',resync);

/* ---------- 登录（哈希比对，连续错误 5 次锁定 30 秒） ---------- */
let fails=0,lockUntil=0;
$('#loginBtn').onclick=async()=>{
  const err=$('#loginErr');
  if(Date.now()<lockUntil){err.textContent='错误次数过多，请 '+Math.ceil((lockUntil-Date.now())/1000)+' 秒后再试';err.style.display='block';return}
  const pwd=$('#pwdInput').value.trim();
  await new Promise(r=>setTimeout(r,20));
  if(pwHash(pwd)!==PW_HASH){
    fails++;$('#pwdInput').value='';
    if(fails>=5){fails=0;lockUntil=Date.now()+30000;err.textContent='错误次数过多，请 30 秒后再试'}else err.textContent='密码错误';
    err.style.display='block';return}
  err.style.display='none';
  $('#loginWrap').hidden=true;$('#appMain').hidden=false;
  await loadSettings();await loadEvents();await loadAllTasks();subscribeRealtime();render();tick();
  setInterval(tick,60000);setInterval(resync,60000);
}
$('#pwdInput').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()}
</script>
</body>
