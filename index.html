<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#1d2433;--mu:#6b7488;--bd:#e3e7f0;--ac:#2f6bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--cd:#1b2029;--tx:#e8ecf4;--mu:#98a1b5;--bd:#2a3140;--ac:#6c95ff}}
:root[data-theme="dark"]{--bg:#12151c;--cd:#1b2029;--tx:#e8ecf4;--mu:#98a1b5;--bd:#2a3140;--ac:#6c95ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 16%,var(--bg)),var(--bg) 45%) fixed}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;max-width:100%}
button{cursor:pointer}
button.pr,.tab.on{background:linear-gradient(135deg,var(--ac),#6a4cf0);border:0;color:#fff}
button.sm{padding:3px 8px;font-size:12px}
button:disabled,input:disabled{opacity:.55;cursor:not-allowed}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;padding:10px 14px;background:color-mix(in srgb,var(--cd) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header>b{font-size:17px;background:linear-gradient(90deg,var(--ac),#8a5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
header .sp,.row .sp{flex:1}
main{max-width:1180px;margin:16px auto;padding:24px;background:var(--cd);border:1px solid var(--bd);border-radius:22px;box-shadow:0 10px 40px #1d243314}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px}
main .cd{background:color-mix(in srgb,var(--bg) 55%,var(--cd));border-radius:16px}
.grid:not(.g2)>.cd{border-top:3px solid var(--ac)}
.k{font-size:12px;color:var(--mu)}.v{font-size:26px;font-weight:700;color:var(--ac)}.v small{font-size:13px;font-weight:400;color:var(--mu)}
h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
h3:before{content:"";width:4px;height:14px;border-radius:2px;background:var(--ac);flex:none}
.br{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.br i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--ac),#8a5cf6)}.br div{background:var(--bd);border-radius:4px}.br span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.dn>div:first-child{width:120px;height:120px;border-radius:50%;flex:none}
.lg span{display:block;font-size:12px}.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tr{display:flex;align-items:flex-end;gap:6px;height:150px;overflow-x:auto}.tr div{flex:1;min-width:26px;text-align:center;font-size:11px;color:var(--mu)}.tr i{display:block;background:linear-gradient(180deg,#8a5cf6,var(--ac));border-radius:4px 4px 0 0;margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}.sc{overflow-x:auto}
/* 任务卡：等高 + 底部操作区对齐 */
.tks{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr))}
.tk{cursor:pointer;border-left:4px solid var(--c)!important;padding:16px 18px!important;display:flex;flex-direction:column;min-width:0;transition:.15s}
.tk:hover{transform:translateY(-2px);box-shadow:0 8px 22px #1d24331f}
.tt{font-weight:600;font-size:15px;margin-bottom:8px;word-break:break-word}
.mt{font-size:12px;color:var(--mu);margin:3px 0;word-break:break-word}
.chs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tg{display:inline-block;background:var(--bg);border-radius:6px;padding:1px 7px;margin:0 4px 4px 0;font-size:11px}
.ch{display:inline-block;color:#fff;border-radius:6px;padding:1px 8px;font-size:11px;background:var(--c)}
.pg{height:5px;background:var(--bd);border-radius:3px;margin:6px 0}.pg i{display:block;height:100%;border-radius:3px;background:var(--c)}
.tk .ac{margin-top:auto;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.stg{margin:4px 0 2px;font-size:12px;color:var(--mu);display:grid;gap:2px}
.stg .cur{color:var(--tx);font-weight:600}.stg .sd{text-decoration:line-through;opacity:.65}.stg .od{color:#d6523f;font-weight:600}
.sl{width:100%;height:22px;padding:0;border:0;background:none;accent-color:#2f6bff;margin:2px 0 4px;cursor:pointer}
/* 弹窗：高内容在小屏不再被顶部裁切 */
.md{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.md>div{position:relative;background:var(--cd);border-radius:16px;padding:28px 30px;width:100%;max-width:720px;margin:auto}
.x{position:absolute;right:12px;top:10px;border:0!important;background:none!important;font-size:22px;line-height:1;padding:6px 10px!important;color:var(--mu)}
.ft{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:10px;margin-top:22px;align-items:center}
.ft .pr{width:100%;height:46px;padding:0;font-size:15px}
.ft #rmv{justify-self:end;width:46px;height:46px;padding:0;background:#d6523f;border-color:#d6523f;color:#fff;font-size:20px;line-height:1}
input:not([type=checkbox]):not([type=range]),select{height:40px}
select{appearance:auto}textarea{resize:vertical;max-width:100%;min-height:64px}
.fm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.fm label{display:block;font-size:12px;color:var(--mu);min-width:0}
.fm input:not([type=checkbox]),.fm select,.fm textarea{width:100%;display:block;margin-top:4px;font-size:15px;padding:8px 12px;min-width:0}
.fm input[type=checkbox]{width:auto;display:inline-block;margin:0 4px 0 0;vertical-align:middle}
.fm input[type=range]{padding:0}
.w2{grid-column:1/3;min-width:0}
.lbh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--bg)}
.sr .l{grid-column:1/3}
.fm .sr input:not([type=checkbox]){margin-top:0;height:36px;font-size:14px}
.sr .sm2{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fm .sr .sm2 label{display:flex;align-items:center;font-size:13px;color:var(--tx)}
.al{position:absolute;right:0;top:calc(100% + 6px);width:min(360px,92vw);max-height:60vh;overflow:auto;z-index:9;box-shadow:0 8px 30px #0004}
#loginWrap{position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#loginBox{background:var(--cd);border-radius:16px;padding:32px;width:min(360px,100%)}
#loginBox input{width:100%;margin:8px 0}
#ts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:16px;z-index:30;max-width:90vw;text-align:center}
.warn{background:#fff4e0;color:#8a5a00;border:1px solid #f0c98a;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12px;word-break:break-all}
.red{color:#d6523f}.org{color:#e0912a}
@media(max-width:560px){
 main{padding:12px;border-radius:16px;margin:8px}
 .fm{grid-template-columns:1fr}.w2{grid-column:auto}.sr .l,.sr .sm2{grid-column:1/3}
 .br{grid-template-columns:90px 1fr 60px}
 .md>div{padding:24px 16px}
 .al{position:fixed;left:8px;right:8px;top:calc(56px + env(safe-area-inset-top,0px));width:auto}
}
</style></head>

<div id="loginWrap">
  <div id="loginBox">
    <h3>内容创意组工作看板</h3>
    <p>请输入访问密码</p>
    <input id="pwdInput" type="password" placeholder="输入密码" autocomplete="current-password">
    <button class="pr" id="loginBtn" style="width:100%">进入看板</button>
    <div id="loginErr" style="color:#d6523f;margin-top:8px;display:none">密码错误</div>
  </div>
</div>

<div id="appMain" hidden></div>
<div id="md"></div><div id="ts" hidden></div>
<datalist id="dpl"></datalist><datalist id="rql"></datalist>

<script>
/* =====================================================================
   数据库准备（仅需在 Supabase → SQL Editor 执行一次）：
   alter table tasks add column if not exists stages jsonb default '[]'::jsonb;
   -- 并确保 tasks 表已开启 Realtime（Database → Replication → supabase_realtime）

   -- 全组共享的设置（设计师/部门/类型/需求人选项 + 提醒时间）：
   create table if not exists settings(key text primary key, value jsonb not null default '{}'::jsonb, updated_at timestamptz default now());
   alter table settings enable row level security;
   drop policy if exists settings_all on settings;
   create policy settings_all on settings for all to anon using (true) with check (true);
   alter publication supabase_realtime add table settings;
   notify pgrst, 'reload schema';
   ===================================================================== */
const SUPABASE_URL = "https://kynlglwctlicnnydumke.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5bmxnbHdjdGxpY25ueWR1bWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NzkzMDYsImV4cCI6MjEwNzQ1NTMwNn0.FpKcqdsrMwb1sRK4nmk8Tf8b0qY7J_pLMgEPnO2v40I"

/* =========== 密码：加盐 + 多轮 SHA-256，代码中不再出现明文 ===========
   修改密码：登录页打开浏览器控制台，执行 pwHash('新密码')，把结果粘贴到 PW_HASH 即可。 */
const PW_SALT = "ledman-board-v1", PW_ITER = 10000
const PW_HASH = "a06b3280b31ab19a5209aab7338f378a259642a52dbdaf2a6ce31ea912566860"
//SHA-BEGIN
function sha256(str){
  const K=[],H=[];let n=2,c=0;
  const fr=x=>Math.floor((x-Math.floor(x))*4294967296)|0;
  while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}
    if(p){if(c<8)H.push(fr(Math.sqrt(n)));K.push(fr(Math.cbrt(n)));c++}n++}
  const m=new TextEncoder().encode(str),l=m.length,tl=((l+9+63)>>6)<<6,b=new Uint8Array(tl);
  b.set(m);b[l]=0x80;const dv=new DataView(b.buffer);
  dv.setUint32(tl-8,Math.floor(l*8/4294967296));dv.setUint32(tl-4,(l*8)>>>0);
  const h=H.slice(),w=new Int32Array(64),R=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<tl;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],d=w[i-2];
      w[i]=(w[i-16]+(R(a,7)^R(a,18)^(a>>>3))+w[i-7]+(R(d,17)^R(d,19)^(d>>>10)))|0}
    let [a,bb,cc,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const t1=(hh+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0;
      const t2=((R(a,2)^R(a,13)^R(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
    h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+cc)|0;h[3]=(h[3]+d)|0;
    h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')
}
function pwHash(p){let h=sha256(PW_SALT+'|'+p);for(let i=0;i<PW_ITER;i++)h=sha256(h+PW_SALT+p);return h}
//SHA-END

const { createClient } = window.supabase
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

/* ---------- 本机设置存储（提醒设置、下拉选项增删、已提醒记录） ---------- */
const LS={get(k,d){try{const v=localStorage.getItem('ledboard_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ledboard_'+k,JSON.stringify(v))}catch(e){}}};
const E4=()=>({ty:[],d:[],r:[],de:[]});
let CFG=LS.get('cfg',null)||{add:E4(),del:E4()};

let B=[];
let S={user:'internal',leader:true,lead:LS.get('lead',[72,48,12,1]),fired:LS.get('fired',{})};
let P={m:'year',off:0,who:'',q:'',st:'',so:'desc'};
const ST_ALL=['待启动','进行中','审核中','已完成','已暂停'];
const SC={'已完成':'#22a06b','进行中':'#2f6bff','待启动':'#8a94a8','审核中':'#e0912a','已暂停':'#d6523f'},
TY=['其他平面设计','效果图-平面','效果图-3D建模渲染','效果图-视频','动画-3D建模渲染','剪辑合成','视频剪辑','视频拍摄','照片拍摄','输出提供','UI交互','品牌推广工具包'];
const LD=[[72,'3天'],[48,'2天'],[12,'半天'],[1,'1小时']];
const iso=d=>d.toLocaleDateString('sv'),TD=()=>iso(new Date()),addD=(s,n)=>iso(new Date(+new Date(s+'T00:00')+n*864e5));
const days=(a,b)=>a&&b?Math.round((new Date(b)-new Date(a))/864e5):null;
const md=s=>s?String(s).slice(5):'?';
let DEF={ty:TY,d:[],r:[],de:[]},DEP=[],REQ=[];
const sp=a=>[...new Set(a.flatMap(x=>(x||'').split(',').map(t=>t.trim())).filter(Boolean))];
let realtimeChannel=null,STAGES_OK=true,SETTINGS_OK=true,SYNC='ok',DRAG=false,PENDING=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 状态 / 进度联动：0%=待启动，1~99%=进行中，100%=已完成 ---------- */
const stByP=pct=>pct>=100?'已完成':pct>0?'进行中':'待启动';
const open_=t=>['待启动','进行中','审核中'].includes(t.s);

/* ---------- 周期：有阶段时 = 各阶段天数之和；否则 = 开始→完成 ---------- */
const stagesOf=t=>Array.isArray(t.stages)?t.stages:[];
const cyc=t=>{const st=stagesOf(t).filter(x=>x.a&&x.b);return st.length?st.reduce((s,x)=>s+Math.max(0,days(x.a,x.b)),0):days(t.a,t.b)};
const stLabel=(s,i)=>s.l||('阶段'+(i+1));

/* ---------- 数据读写 ---------- */
function norm(r){
  let st=r.stages;if(typeof st==='string'){try{st=JSON.parse(st)}catch(e){st=[]}}
  let rm=r.rm;if(typeof rm==='string'){try{rm=JSON.parse(rm)}catch(e){rm=[]}}
  return{...r,s:r.s==='待开展'?'待启动':(r.s||'待启动'),p:+r.p||0,a:(r.a||'').slice(0,10),b:(r.b||'').slice(0,10),
    stages:Array.isArray(st)?st:[],rm:Array.isArray(rm)?rm:[],de:r.de||'',r:r.r||'',d:r.d||'',t:r.t||''}
}
function rebuildLists(){
  const base={ty:TY,d:sp(B.map(x=>x.d)),r:sp(B.map(x=>x.r)),de:[...new Set(B.map(x=>x.de).filter(Boolean))]};
  DEF={};Object.keys(base).forEach(k=>{DEF[k]=[...new Set([...base[k],...(CFG.add[k]||[])])].filter(v=>!(CFG.del[k]||[]).includes(v));if(k!=='ty')DEF[k].sort()});
  DEP=DEF.d;REQ=DEF.r;
}
/* ---------- 全组共享设置：settings 表，key='board' ---------- */
const cfgVal=v=>{if(typeof v==='string'){try{v=JSON.parse(v)}catch(e){return null}}return v&&typeof v==='object'?v:null};
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v);
function applyCfg(v){
  CFG={add:{...E4(),...(v.add||{})},del:{...E4(),...(v.del||{})}};
  if(Array.isArray(v.lead))S.lead=v.lead.map(Number).filter(x=>x>0).sort((a,b)=>b-a);
  LS.set('cfg',CFG);LS.set('lead',S.lead);rebuildLists();
}
async function loadSettings(){
  const {data,error}=await sb.from('settings').select('value').eq('key','board').maybeSingle();
  if(error){SETTINGS_OK=false;console.warn('settings 读取失败',error);toast('读取设置失败：'+error.message);return false}
  SETTINGS_OK=true;
  const cv=data&&cfgVal(data.value);
  if(cv){applyCfg(cv);return true}
  // 云端还没有设置：把本机已有的设置作为初始值上传一次
  const lc=LS.get('cfg',null),ll=LS.get('lead',null);
  if(lc||ll){const v={add:(lc||CFG).add,del:(lc||CFG).del,lead:ll||S.lead};await sb.from('settings').upsert({key:'board',value:v,updated_at:new Date().toISOString()});applyCfg(v)}
  return true;
}
async function mutateCfg(fn){ // 先取云端最新值再改，避免覆盖他人刚做的修改
  setSync('saving');
  let cur={add:CFG.add,del:CFG.del,lead:S.lead};
  if(SETTINGS_OK){
    const {data,error}=await sb.from('settings').select('value').eq('key','board').maybeSingle();
    const cv=!error&&data&&cfgVal(data.value);
    if(cv)cur={add:{...E4(),...(cv.add||{})},del:{...E4(),...(cv.del||{})},lead:Array.isArray(cv.lead)?cv.lead:S.lead};
  }
  fn(cur);
  if(SETTINGS_OK){
    const {error}=await sb.from('settings').upsert({key:'board',value:cur,updated_at:new Date().toISOString()});
    if(error){toast('设置保存失败：'+error.message);setSync('err');return false}
    // 读回校验：确认云端真的存进去了、且能读出同样的内容
    const rb=await sb.from('settings').select('value').eq('key','board').maybeSingle(),bv=rb.data&&cfgVal(rb.data.value);
    if(rb.error||!bv||sj(bv)!==sj(cur)){setSync('err');toast('⚠ 设置已提交，但读回内容与保存的不一致，请检查 settings 表的 value 列类型是否为 jsonb、key 是否唯一');return false}
  }
  applyCfg(cur);setSync('ok');return true;
}
function setSync(s){SYNC=s;const e=$('#sc');if(e)e.textContent=({ok:'🟢 实时同步',poll:'🟡 定时同步',saving:'⏳ 保存中…',err:'🔴 同步失败'})[s]||''}
async function loadAllTasks(){
  // Supabase 单次最多返回 1000 行，这里分页读取，避免超过 1000 条后静默丢数据
  let rows=[],from=0;const step=1000;
  for(;;){
    const {data,error}=await sb.from('tasks').select('*').order('id').range(from,from+step-1);
    if(error){toast('读取任务失败：'+error.message);setSync('err');return false}
    rows=rows.concat(data||[]);if(!data||data.length<step)break;from+=step;
  }
  B=rows.map(norm);
  STAGES_OK=!rows.length||rows.some(r=>'stages' in r);
  rebuildLists();return true;
}
function rowOf(t){
  const r={id:t.id,t:t.t,ty:t.ty,d:t.d,s:t.s,p:t.p,n:(t.n===''||t.n==null)?null:+t.n,a:t.a||null,b:t.b||null,de:t.de,r:t.r,f:!!t.f,note:t.note,pr:t.pr,path:t.path,rm:t.rm||[]};
  if(STAGES_OK)r.stages=t.stages||[];return r;
}
async function saveTaskToDb(t){
  setSync('saving');
  let {error}=await sb.from('tasks').upsert(rowOf(t));
  if(error&&STAGES_OK&&/stages/i.test(error.message||'')){
    STAGES_OK=false;({error}=await sb.from('tasks').upsert(rowOf(t)));
  }
  if(error){toast('保存失败：'+error.message);setSync('err');return false}
  setSync('ok');return true;
}
async function patchTask(t,fields){ // 乐观更新，失败自动还原
  const old={};Object.keys(fields).forEach(k=>old[k]=t[k]);Object.assign(t,fields);render();setSync('saving');
  const {data,error}=await sb.from('tasks').update(fields).eq('id',t.id).select('id');
  if(error||!data||!data.length){Object.assign(t,old);render();setSync('err');toast(error?'保存失败，已还原：'+error.message:'该任务已被他人删除，请刷新');return false}
  setSync('ok');return true;
}
async function deleteTaskFromDb(id){
  const {error}=await sb.from('tasks').delete().eq('id',id);
  if(error){toast('删除失败：'+error.message);return false}

}

function applyChange(p){
  if(p.eventType==='DELETE'){B=B.filter(x=>x.id!=(p.old||{}).id)}
  else if(p.new){const r=norm(p.new),i=B.findIndex(x=>x.id==r.id);i>=0?B[i]=r:B.push(r)}
  rebuildLists();soft();
}
function subscribeRealtime(){
  if(realtimeChannel)sb.removeChannel(realtimeChannel);

    .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},applyChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'settings'},p=>{const cv=p.new&&cfgVal(p.new.value);if(cv){applyCfg(cv);soft()}})
    .subscribe(st=>{if(st==='SUBSCRIBED')setSync('ok');else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(st))setSync('poll')});

}

function form(t){const n=!t,x=t||{id:'c'+Date.now()+Math.random().toString(36).slice(2,6),t:'',ty:TY[0],d:'',s:'待启动',p:0,n:'',a:TD(),b:addD(TD(),3),de:S.leader?(P.who||(DEF.de[0]||'')):S.user,r:'',f:false,note:'',pr:'',path:'',rm:[],stages:[]};
 const rm=x.rm||[],stdH=LD.map(v=>v[0]),extra=rm.filter(v=>!stdH.includes(v)),o=(a,v)=>a.map(i=>`<option ${i==v?'selected':''}>${i}</option>`).join(''),
 sel=(i,k,v)=>`<select id="f_${i}">${v?'':'<option value="">请选择</option>'}${[...new Set([...DEF[k],...(v?[v]:[])])].map(e=>`<option ${e==v?'selected':''}>${esc(e)}</option>`).join('')}</select>`;
 let ST=JSON.parse(JSON.stringify(x.stages||[]));
 $('#md').innerHTML=`<div class="md"><div><button class="x" id="no">✕</button><h3>${n?'新建':'编辑'}任务卡</h3><div class="fm">
 <label class="w2">工作内容<input id="f_t" value="${esc(x.t)}"></label>
 <label>设计类型${sel('ty','ty',x.ty)}</label><label>事业部/部门${sel('d','d',x.d)}</label>
 <label>需求人${sel('r','r',x.r)}</label><label>设计师${S.leader?sel('de','de',x.de):`<input id="f_de" value="${esc(x.de)}" disabled>`}</label>
 <label>开始时间<input type="date" id="f_a" value="${x.a||''}"></label>
 <label><span class="lbh">计划完成时间<button type="button" class="sm" id="addSt" title="添加阶段时间（审核/穿插/暂停后分段完成）">＋ 阶段</button></span><input type="date" id="f_b" value="${x.b||''}"></label>
 <div class="w2"><div id="stl"></div><div class="k" id="stn" hidden>已启用阶段时间：开始/完成时间由阶段自动计算，周期 = 各阶段天数之和；每个未完成阶段的结束日都会单独触发提醒。</div></div>
 <div class="w2">周期：<b id="cy"></b> ${[[1,'1天'],[2,'2天'],[3,'3天'],[7,'1周'],[14,'2周']].map(([d,k])=>`<button type="button" class="sm" data-c="${d}">${k}</button>`).join(' ')}</div>
 <label>进展状态<select id="f_s">${o(ST_ALL,x.s)}</select></label><label>优先级<select id="f_pr"><option></option>${o(['高','中','低'],x.pr)}</select></label>
 <label>进度 <span id="pv_">${Math.round((x.p||0)*100)}%</span><input type="range" class="sl" id="f_p" min="0" max="100" step="5" value="${Math.round((x.p||0)*100)}"></label>
 <label>定稿数量<input type="number" id="f_n" value="${x.n??''}"></label>
 <label class="w2"><input type="checkbox" id="f_f" ${x.f?'checked':''}> 是否有流程</label>
 <label class="w2">项目路径位置<input id="f_path" value="${esc(x.path||'')}" placeholder="粘贴网盘链接或文件夹路径"></label>
 <label class="w2">工作进展描述<textarea id="f_note" rows="2">${esc(x.note||'')}</textarea></label>
 <div class="w2"><span class="k">本任务预警提醒（不选则用默认）</span><br>${LD.map(([h,k])=>`<label style="display:inline-block;margin-right:10px"><input type="checkbox" class="rmc" value="${h}" ${rm.includes(h)?'checked':''}> 截止前${k}</label>`).join('')}<label style="display:block;margin-top:6px">其他提醒（小时，逗号分隔）<input id="f_rmx" value="${extra.join(',')}" placeholder="如 6,24"></label></div></div>
 <div class="ft"><span></span><button class="pr" id="ok">保存</button>${n?'<span></span>':'<button id="rmv" title="删除" aria-label="删除">🗑</button>'}</div></div></div>`;

 /* 阶段时间编辑 */
 const stRows=()=>{$('#stl').innerHTML=ST.map((s,i)=>`<div class="sr" data-i="${i}"><input class="l sl_l" placeholder="阶段名称，如：初稿 / 修改 / 终稿" value="${esc(s.l||'')}"><input type="date" class="sl_a" value="${s.a||''}" title="阶段开始"><input type="date" class="sl_b" value="${s.b||''}" title="阶段结束"><div class="sm2"><label><input type="checkbox" class="sl_d" ${s.d?'checked':''}> 该阶段已完成</label><span class="k sdu">${s.a&&s.b?days(s.a,s.b)+' 天':'-'}</span><button type="button" class="sm sdel">✕ 删除</button></div></div>`).join('')};
 const sync=()=>{const has=ST.length>0;
  if(has){const as=ST.map(s=>s.a).filter(Boolean).sort(),bs=ST.map(s=>s.b).filter(Boolean).sort();$('#f_a').value=as[0]||'';$('#f_b').value=bs[bs.length-1]||''}
  $('#f_a').disabled=$('#f_b').disabled=has;document.querySelectorAll('[data-c]').forEach(b=>b.disabled=has);$('#stn').hidden=!has;
  const tot=ST.filter(s=>s.a&&s.b).reduce((z,s)=>z+Math.max(0,days(s.a,s.b)),0);
  $('#cy').textContent=has?`${tot} 天（${ST.length} 个阶段合计）`:((days($('#f_a').value,$('#f_b').value)??'-')+' 天')};
 stRows();sync();
 $('#f_a').onchange=$('#f_b').onchange=sync;
 $('#addSt').onclick=()=>{
  if(!ST.length){ST.push({l:'阶段1',a:$('#f_a').value||TD(),b:$('#f_b').value||addD(TD(),1),d:false})}
  const last=ST[ST.length-1],a=last.b?addD(last.b,1):TD();
  ST.push({l:'阶段'+(ST.length+1),a,b:addD(a,1),d:false});stRows();sync()};
 $('#stl').oninput=$('#stl').onchange=e=>{const r=e.target.closest('.sr');if(!r)return;const s=ST[+r.dataset.i],c=e.target.classList;
  if(c.contains('sl_l'))s.l=e.target.value;else if(c.contains('sl_a'))s.a=e.target.value;else if(c.contains('sl_b'))s.b=e.target.value;else if(c.contains('sl_d'))s.d=e.target.checked;
  r.querySelector('.sdu').textContent=s.a&&s.b?days(s.a,s.b)+' 天':'-';sync()};
 $('#stl').onclick=e=>{const b=e.target.closest('.sdel');if(b){ST.splice(+b.closest('.sr').dataset.i,1);stRows();sync()}};

 /* 进度 ↔ 状态 联动 */
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{$('#f_b').value=addD($('#f_a').value||TD(),+b.dataset.c);sync()});
 $('#f_p').oninput=e=>{const v=+e.target.value;$('#pv_').textContent=v+'%';$('#f_s').value=stByP(v)};
 $('#f_s').onchange=e=>{const s=e.target.value;if(s=='已完成'){$('#f_p').value=100;$('#pv_').textContent='100%'}else if(s=='待启动'){$('#f_p').value=0;$('#pv_').textContent='0%'}};
 $('#no').onclick=()=>$('#md').innerHTML='';
 const r=$('#rmv');if(r)r.onclick=()=>ask('确定删除该任务？',async()=>{if(await deleteTaskFromDb(x.id)){render();toast('已删除')}},'删除');
 $('#ok').onclick=async()=>{const v=i=>$('#f_'+i).value.trim();
  if(!v('t'))return toast('请填写工作内容');
  const sts=ST.map(s=>({l:(s.l||'').trim(),a:s.a||'',b:s.b||'',d:!!s.d}));
  for(const s of sts){if(!s.a||!s.b)return toast('请补全每个阶段的开始和结束日期');if(s.b<s.a)return toast('阶段结束时间不能早于阶段开始时间')}
  sts.sort((p,q)=>p.a<q.a?-1:p.a>q.a?1:p.b<q.b?-1:p.b>q.b?1:0);sts.forEach((s,i)=>{if(!s.l)s.l='阶段'+(i+1)});
  let a=v('a'),b=v('b');if(sts.length){a=sts[0].a;b=sts.map(s=>s.b).sort().pop()}
  if(a&&b&&b<a)return toast('完成时间不能早于开始时间');
  let s=v('s'),p=Math.round(+$('#f_p').value)/100;if(s=='已完成')p=1;if(s=='待启动')p=0;
  const rmv=[...document.querySelectorAll('.rmc:checked')].map(c=>+c.value).concat(v('rmx').split(/[,，]/).map(Number).filter(z=>z>0));
  $('#ok').disabled=true;
  const okk=await put({...x,t:v('t'),ty:v('ty'),d:v('d'),r:v('r'),de:v('de'),a,b,s,p,pr:v('pr'),n:v('n'),f:$('#f_f').checked,note:v('note'),path:v('path'),rm:[...new Set(rmv)],stages:sts});
  if(!okk&&$('#ok'))$('#ok').disabled=false}}

function setf(tab){const tp=tab!='al',N={ty:'设计类型',d:'事业部/部门',r:'需求人',de:'设计师'},stdH=LD.map(v=>v[0]),extra=S.lead.filter(v=>!stdH.includes(v));
 $('#md').innerHTML=`<div class="md"><div><button class="x" id="no">✕</button><h3>⚙ 设置</h3><div class="row"><button class="tab ${tp?'on':''}" id="t1">任务卡模板</button><button class="tab ${tp?'':'on'}" id="t2">预警提醒</button></div>`+(tp?Object.keys(N).map(k=>`<div style="margin-bottom:16px"><b>${N[k]}</b>（${DEF[k].length}）<div style="margin:8px 0">${DEF[k].map((v,i)=>`<span class="tg" style="padding:3px 6px 3px 9px">${esc(v)} <a href="#" class="dx" data-k="${k}" data-i="${i}" style="color:#d6523f;text-decoration:none">✕</a></span>`).join('')}</div><div class="row" style="margin:0"><input id="ni_${k}" data-k="${k}" placeholder="新增${N[k]}" style="flex:1;min-width:0"><button class="ad" data-k="${k}">＋ 添加</button></div></div>`).join('')+'<div class="k">增删只影响新建/编辑任务卡时的下拉选项，已有任务不受影响；选项设置全组共享，所有人同步生效。</div>':
 `<div class="k">截止时间按计划完成日（或各阶段结束日）18:00 计算。进入所选时间窗口后会出现在预警列表，并弹出提醒。提醒时间设置全组共享，修改后所有人生效（单张任务卡上单独勾选的提醒不受影响）。</div><p>${LD.map(([h,k])=>`<label style="display:block;margin:6px 0"><input type="checkbox" class="dc" value="${h}" ${S.lead.includes(h)?'checked':''}> 截止前 ${k}提醒（${h}小时）</label>`).join('')}</p><label class="k">自定义（小时，多个用逗号）<input id="cu" value="${extra.join(',')}" placeholder="如 6,24" style="width:100%"></label><p><button id="nt">🔔 开启系统通知</button></p><div class="ft"><span></span><button class="pr" id="sv">保存</button><span></span></div>`)+`</div></div>`;
 $('#no').onclick=()=>{$('#md').innerHTML=''};$('#t1').onclick=()=>setf('tp');$('#t2').onclick=()=>setf('al');
 const add=async k=>{const v=$('#ni_'+k).value.trim();if(!v)return;if(await mutateCfg(c=>{c.add[k]=[...new Set([...(c.add[k]||[]),v])];c.del[k]=(c.del[k]||[]).filter(z=>z!==v)}))setf('tp')};
 document.querySelectorAll('.ad').forEach(b=>b.onclick=()=>add(b.dataset.k));document.querySelectorAll('[id^=ni_]').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')add(i.dataset.k)});
 document.querySelectorAll('.dx').forEach(a=>a.onclick=async e=>{e.preventDefault();const k=a.dataset.k,v=DEF[k][+a.dataset.i];if(await mutateCfg(c=>{c.add[k]=(c.add[k]||[]).filter(z=>z!==v);c.del[k]=[...new Set([...(c.del[k]||[]),v])]}))setf('tp')});
 const nt=$('#nt');if(nt)nt.onclick=()=>{try{Notification.requestPermission().then(r=>toast(r=='granted'?'通知已开启':'未授权，仍会在页面内提醒'))}catch(e){toast('当前浏览器不支持系统通知')}};
 const sv=$('#sv');if(sv)sv.onclick=async()=>{const lead=[...new Set([...document.querySelectorAll('.dc:checked')].map(c=>+c.value).concat($('#cu').value.split(/[,，]/).map(Number).filter(x=>x>0)))].sort((a,b)=>b-a);sv.disabled=true;
  if(await mutateCfg(c=>{c.lead=lead})){$('#md').innerHTML='';render();tick();toast('提醒设置已保存（全组共享）')}else sv.disabled=false}}

/* ---------- 到期提醒：登录后立即检查，之后每分钟 + 切回页面时检查；已提醒记录持久化，刷新不重复轰炸 ---------- */
function tick(){
  if(!B.length)return;
  const today=TD(),fresh=[];
  alerts(visible()).forEach(a=>{const k=a.t.id+'|'+a.end+'|'+a.lv+(a.lv===0?'|'+today:'');if(S.fired[k])return;S.fired[k]=Date.now();fresh.push(a)});
  if(!fresh.length)return;
  const lim=Date.now()-60*864e5;Object.keys(S.fired).forEach(k=>{if(S.fired[k]<lim)delete S.fired[k]});LS.set('fired',S.fired);
  const f0=fresh[0];toast(`⏰ ${f0.t.t}${f0.sg?'['+f0.sg+']':''}：${fh(f0.h)}${fresh.length>1?`　等共 ${fresh.length} 项`:''}`);
  try{if(Notification.permission=='granted')fresh.slice(0,5).forEach(a=>new Notification('任务预警',{body:`${a.t.t}${a.sg?'['+a.sg+']':''}：${fh(a.h)}`}))}catch(e){}
}

document.addEventListener('click',e=>{const a=$('#alp');if(a&&!a.hidden&&!e.target.closest('#alp,#bl,[data-e]'))a.hidden=true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resync()});
window.addEventListener('online',resync);

/* ---------- 登录（哈希比对，连续错误 5 次锁定 30 秒） ---------- */
let fails=0,lockUntil=0;
$('#loginBtn').onclick=async()=>{
  const err=$('#loginErr');
  if(Date.now()<lockUntil){err.textContent='错误次数过多，请 '+Math.ceil((lockUntil-Date.now())/1000)+' 秒后再试';err.style.display='block';return}
  const pwd=$('#pwdInput').value.trim();
  await new Promise(r=>setTimeout(r,20));
  if(pwHash(pwd)!==PW_HASH){
    fails++;$('#pwdInput').value='';
    if(fails>=5){fails=0;lockUntil=Date.now()+30000;err.textContent='错误次数过多，请 30 秒后再试'}else err.textContent='密码错误';
    err.style.display='block';return}
  err.style.display='none';
  $('#loginWrap').hidden=true;$('#appMain').hidden=false;
  await loadSettings();await loadAllTasks();subscribeRealtime();render();tick();
  setInterval(tick,60000);setInterval(resync,60000);
}
$('#pwdInput').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()}
</script>
